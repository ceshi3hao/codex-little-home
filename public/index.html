<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1418">
    <title>Codex 小窝</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="Codex 小窝的可旋转三维室内"></canvas>
    <main id="hud">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Codex 小窝首页"><span class="brand-mark" aria-hidden="true"></span><span>Codex 小窝</span></a>
        <nav class="camera-controls" aria-label="镜头控制">
          <button type="button" data-camera="overview">全屋</button>
          <button type="button" data-camera="desk">工作台</button>
          <button type="button" data-camera="living">客厅</button>
        </nav>
        <div class="connection" aria-live="polite"><span class="signal" id="signal" aria-hidden="true"></span><span id="connection-text">连接本机 Codex</span></div>
      </header>

      <section class="status-panel panel" aria-label="工作状态">
        <p class="eyebrow">CODEX WORKROOM</p>
        <h1 id="workspace-name">加载中</h1>
        <div class="status-line"><span id="scene-state">安静待命</span><span class="state-tag" id="state-tag">待命</span></div>
        <p class="scene-copy" id="scene-copy">拖动房屋查看每个房间。</p>
        <div class="scene-tools"><button type="button" id="reset-camera">重置镜头</button><span>拖动旋转 · 双指缩放</span></div>
      </section>

      <button class="panel-toggle" id="panel-toggle" type="button" aria-expanded="true" aria-controls="task-panel">任务</button>
      <aside class="task-panel panel" id="task-panel" aria-label="Codex 任务控制台">
        <form class="task-form" id="task-form">
          <label for="prompt">交给 Codex 的任务</label>
          <textarea id="prompt" name="prompt" rows="4" maxlength="8000" placeholder="例如：检查这个项目的构建报错并修复它。" required></textarea>
          <div class="form-row"><span id="form-hint">任务会交给当前工作区的 Codex。</span><button class="primary-action" id="start-button" type="submit">开始任务</button></div>
        </form>
        <section class="task-area" aria-label="任务记录"><div class="section-head"><h2>工作记录</h2><span id="task-count">0</span></div><div class="task-list" id="task-list" aria-live="polite"></div></section>
        <section class="output-area" aria-label="任务输出"><div class="section-head"><h2>任务输出</h2><button class="copy-button" id="copy-output" type="button" disabled>复制</button></div><p class="output-meta" id="output-meta">等待任务</p><pre class="task-output" id="task-output" aria-live="polite">创建任务后，完整回复会显示在这里。</pre></section>
        <section class="feed-area" aria-label="实时事件"><div class="section-head"><h2>实时动态</h2><span class="live-dot">LIVE</span></div><ol class="event-feed" id="event-feed" aria-live="polite"></ol></section>
      </aside>
    </main>
    <template id="task-template"><article class="task-row"><div class="task-main"><p class="task-prompt"></p><time></time></div><div class="task-actions"><span class="task-status"></span><div class="task-buttons"><button class="view-button" type="button">查看</button><button class="stop-button" type="button">停止</button></div></div></article></template>
    <template id="event-template"><li><time></time><span></span></li></template>
    <script type="module" src="room.js"></script>
    <script type="module" src="tasks.js"></script>
  </body>
</html>
